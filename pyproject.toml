[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freqtrade-hyperopt-guard"
version = "0.1.0"
description = "Stop a Freqtrade hyperopt run from handing you untradeable parameters."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["freqtrade", "hyperopt", "overfitting", "algorithmic-trading", "optimization"]
authors = [{ name = "VolatiCloud" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/volaticloud/freqtrade-hyperopt-guard"
Issues = "https://github.com/volaticloud/freqtrade-hyperopt-guard/issues"

[project.scripts]
freqtrade-hyperopt-guard = "freqtrade_hyperopt_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freqtrade_hyperopt_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
